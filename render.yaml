databases:
  - name: askmcneese-class-planner-db
    databaseName: askmcneese
    user: askmcneese
    region: ohio
    plan: free

services:
  - type: web
    name: askmcneese
    runtime: python
    region: ohio
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CLASS_DATA_MODE
        value: live
      - key: DATABASE_URL
        fromDatabase:
          name: askmcneese-class-planner-db
          property: connectionString
      - key: CLASS_SYNC_ADMIN_TOKEN
        sync: false
      - key: CLASS_BOOTSTRAP_ON_START
        value: true
      - key: CLASS_SYNC_TERM_ID
        value: 202660
      - key: CLASS_SYNC_MAX_CONCURRENCY
        value: "2"
      - key: WEB_BROWSER_MODE
        value: off
      - key: CORS_ALLOWED_ORIGINS
        value: https://closedbeta.mcneeseacm.com,https://askmcneese-1.onrender.com
      - key: GUEST_COOKIE_SECURE
        value: true
  - type: web
    name: askmcneese-1
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - closedbeta.mcneeseacm.com
    renderSubdomainPolicy: enabled
    envVars:
      - key: VITE_CLASS_DATA_MODE
        value: live
      - key: VITE_CLASS_TERM_ID
        value: 202660
      - key: VITE_API_BASE_URL
        value: https://askmcneese.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
