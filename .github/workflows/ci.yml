name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    name: Backend import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify dependency consistency
        run: pip check

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          # PYSEC-2026-311 / CVE-2026-45829: Chroma Python HTTP server RCE.
          # No fixed PyPI release yet (fix merged upstream, not shipped).
          # AskMcNeese uses embedded PersistentClient only — do not expose
          # chroma’s FastAPI server. Drop the ignore when 1.5.10+ lands.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311

      - name: Verify FastAPI app imports
        run: python -c "from app.main import app; assert app.title == 'AskMcNeese API'"

      - name: Run backend unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
