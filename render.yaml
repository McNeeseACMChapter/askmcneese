databases:
  - name: askmcneese-class-planner-db
    databaseName: askmcneese
    user: askmcneese
    region: ohio
    plan: starter

services:
  - type: web
    name: askmcneese-api
    runtime: python
    region: ohio
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CLASS_DATA_MODE
        value: live
      - key: DATABASE_URL
        fromDatabase:
          name: askmcneese-class-planner-db
          property: connectionString
      - key: CLASS_SYNC_ADMIN_TOKEN
        sync: false
  - type: web
    name: askmcneese
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_CLASS_DATA_MODE
        # Promote to live only after migrations, initial sync, and smoke gates pass.
        value: staging
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
